# Stage 7: fetch every remaining candidate page from Common Crawl's WARC files
# and score it (relevance + personal/professional), keeping pages above the
# relevance threshold. Takes candidates from a site-content release and
# publishes a page-pass-run-<n> release with the final page list, a site
# table (with site_kind), a report, and the fetched page text for later
# extraction. All jobs run on Arm runners. See docs/DESIGN.md, Stage 7.
name: page-pass

on:
  workflow_dispatch:
    inputs:
      site_content_release:
        description: "site-content release(s) to take candidates from (comma-separated; URLs de-duplicated)"
        default: "site-content-run-1"
        required: true
      skip_pages_from:
        description: "Optional: page-pass releases (comma-separated) whose tried pages are left out"
        default: ""
        required: false
      partitions:
        description: "Fetch partitions (each site stays in one partition)"
        default: "16"
        required: true
      threshold:
        description: "Keep pages whose relevance score is at least this"
        default: "0.3"
        required: true
      publish:
        description: "Attach outputs to a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write   # read the source release, create the page-pass-run-<n> release

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - name: Split candidates by site
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in $(echo "${{ inputs.site_content_release }}" | tr ',' ' '); do
            gh release download "$r" --pattern candidates.tsv.gz --dir "cand/$r"; done
          skip=(); if [ -n "${{ inputs.skip_pages_from }}" ]; then
            # Every page already tried (not just the kept ones): scored.tsv.gz, or the page text of older runs.
            for r in $(echo "${{ inputs.skip_pages_from }}" | tr ',' ' '); do
              gh release download "$r" --pattern scored.tsv.gz --dir "skip/$r" 2>/dev/null \
                || gh release download "$r" --pattern 'pages-part-*.jsonl.gz' --dir "skip/$r"; done
            python3 -I scripts/scored_urls.py --out skip.tsv.gz 'skip/*/*.gz'; skip=(skip.tsv.gz); fi
          python3 -I scripts/page_pass.py split --candidates 'cand/*/candidates.tsv.gz' --skip-urls "${skip[@]}" \
            --partitions "${{ inputs.partitions }}" --out-dir plan
          echo "parts=$(python3 -c "import json; print(json.dumps(list(range(${{ inputs.partitions }}))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: page-plan
          path: plan/
          retention-days: 30

  fetch:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6   # free plan: 20 concurrent jobs shared with other repos (DESIGN.md)
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: page-plan
          path: plan/
      - name: Show this runner's public IP
        run: |
          echo "public IP: $(curl -s -m 10 https://checkip.amazonaws.com || echo unknown)"
      - name: Build
        run: go build -o warcfetch ./cmd/warcfetch
      - name: Fetch pages from WARC files
        run: |
          mkdir -p out
          ./warcfetch -in "plan/part-${{ matrix.part }}.tsv" -out "out/pages-part-${{ matrix.part }}.jsonl" -max-text 8000
          gzip out/*.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: page-text-${{ matrix.part }}
          path: out/
          retention-days: 30

  score:
    needs: [plan, fetch]
    if: ${{ !cancelled() }}   # score whichever partitions succeeded
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Wait for every partition's artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The artifact list lags uploads by a few seconds (extract-run-17 lost a partition).
          want=$(echo '${{ needs.plan.outputs.parts }}' | jq length)
          for i in $(seq 1 30); do
            have=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name | startswith("page-text-"))] | length')
            echo "artifacts listed: $have of $want"
            [ "$have" -ge "$want" ] && exit 0
            sleep 10
          done
          echo "::warning::only $have of $want partitions uploaded; scoring those"
      - uses: actions/download-artifact@v4
        with:
          pattern: page-text-*
          path: text/
          merge-multiple: true
      - name: Score pages and sites
        run: |
          ls -la text/
          python3 -I scripts/page_pass.py score --pages 'text/*.jsonl.gz' \
            --threshold "${{ inputs.threshold }}" --out-dir out
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: page-pass-report
          path: out/
          retention-days: 30
      - name: Publish release assets
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="page-pass-run-${{ github.run_number }}"
          # No --target: tagging the run's own commit fails with 403 once main has newer
          # workflow files (needs the workflows permission). See DESIGN.md.
          gh release create "$tag" --title "Page pass (run ${{ github.run_number }})" \
            --notes "Every candidate page from ${{ inputs.site_content_release }} fetched and scored; pages kept at relevance >= ${{ inputs.threshold }}. pages.tsv.gz is the final page list; scored.tsv.gz lists every page tried; sites.tsv.gz has site_kind; page-text-*.jsonl.gz hold the fetched text. See report.md. Built from commit $GITHUB_SHA."
          gh release upload "$tag" out/report.md out/pages.tsv.gz out/sites.tsv.gz out/scored.tsv.gz
          for f in text/*.jsonl.gz; do gh release upload "$tag" "$f"; done
