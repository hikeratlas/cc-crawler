# Stages 4–5: look up seed sites in Common Crawl's CDX index, score each site
# from its URLs, and emit candidate post URLs. See docs/DESIGN.md, Stage 4.
#
# The site list is split into partitions; each partition is one job that looks
# its sites up in every crawl (sequentially, politely paced) and scores them.
# A final job merges the per-site rows into a report and publishes a release
# named site-urls-run-<run number>. All jobs run on Arm runners.
#
# Typical use is two passes (the first can also start from a slug-scan-*
# release: sites found by the hike names in their URLs, Stage 6b):
#   1. classify: site_source = a graph-seeds-* release, top = 0 (all seeds),
#      two crawls, max_blocks = 1. Cheap; gives every site a verdict.
#   2. harvest:  site_source = the site-urls-* release from pass 1, verdicts =
#      hiking,mixed,drifted (the sites kept), all crawls, max_blocks = 4.
name: site-urls

on:
  workflow_dispatch:
    inputs:
      site_source:
        description: "Release to take sites from: graph-seeds-* (ranked seeds), slug-scan-* (sites found by hike names in URLs), site-urls-* (sites kept by a previous run), or file:<repo path> (one site per line)"
        default: "graph-seeds-run-2"
        required: true
      top:
        description: "graph-seeds source only: number of top seeds with >= 2 hubs (0 = all)"
        default: "0"
        required: true
      min_score:
        description: "slug-scan source only: minimum score; sites already in the page pass are skipped"
        default: "50"
        required: true
      crawls:
        description: "Comma-separated crawl ids"
        default: "CC-MAIN-2026-34,CC-MAIN-2023-40"
        required: true
      verdicts:
        description: "site-urls source only: comma-separated verdicts to take from the previous run"
        default: "hiking,mixed,drifted"
        required: true
      mode:
        description: "slug: keep pages whose slug names a hike or place, on hiking/mixed sites. posts: keep every blog-post URL, off_topic sites included (platform blogs, whose diary-style URLs rarely name the hike). all: keep every English page (deep harvest of known-good sites). The content stages decide"
        type: choice
        options: [slug, posts, all]
        default: slug
      max_blocks:
        description: "Max CDX blocks (~3,000 captures each) per site per crawl"
        default: "1"
        required: true
      partitions:
        description: "Number of parallel site partitions"
        default: "8"
        required: true
      publish:
        description: "Attach outputs to a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write   # read the source release, create the site-urls-run-<n> release

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      parts: ${{ steps.split.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and split the site list
        id: split
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.site_source }}
          TOP: ${{ inputs.top }}
          P: ${{ inputs.partitions }}
          VERDICTS: ${{ inputs.verdicts }}
          MIN_SCORE: ${{ inputs.min_score }}
        run: |
          mkdir -p plan
          case "$SOURCE" in
            graph-seeds-*)
              gh release download "$SOURCE" --pattern seeds.tsv.gz --dir plan
              zcat plan/seeds.tsv.gz | awk -F'\t' 'NR > 1 && $4 >= 2 { print $2 }' > plan/ranked.txt
              if [ "$TOP" != 0 ]; then head -n "$TOP" plan/ranked.txt > plan/t && mv plan/t plan/ranked.txt; fi
              ;;
            slug-scan-*)
              # New sites (known = False) with score >= MIN_SCORE, best first.
              gh release download "$SOURCE" --pattern slug_sites.tsv.gz --dir plan
              zcat plan/slug_sites.tsv.gz | awk -F'\t' -v m="$MIN_SCORE" 'NR == 1 { for (i = 1; i <= NF; i++) c[$i] = i; next }
                $c["known"] == "False" && $c["score"] + 0 >= m { print $1 }' > plan/ranked.txt
              ;;
            site-urls-*)
              gh release download "$SOURCE" --pattern sites.tsv.gz --dir plan
              gh release download "$SOURCE" --pattern seeds.tsv.gz --dir plan || true
              zcat plan/sites.tsv.gz | awk -F'\t' -v v="$VERDICTS" 'BEGIN { n = split(v, a, ","); for (i = 1; i <= n; i++) keep[a[i]] = 1 }
                NR > 1 && ($2 in keep) { print $1 }' > plan/ranked.txt
              ;;
            file:*)
              grep -v '^#' "${SOURCE#file:}" | cut -f1 | sed '/^$/d' > plan/ranked.txt
              ;;
            *) echo "::error::unknown site_source $SOURCE"; exit 1 ;;
          esac
          # Eval domains are always included; hubs are reference sites, never seeds.
          { cat plan/ranked.txt
            tail -n +2 data/eval/known_blogs.csv | cut -d, -f1
            tail -n +2 data/eval/negatives.csv | cut -d, -f1
          } | awk '!seen[$0]++' | grep -vxF -f <(tail -n +2 data/hubs.csv | cut -d, -f1) > plan/sites.txt
          wc -l plan/sites.txt
          # Round-robin by rank so every partition gets a similar mix of big and small sites.
          for ((i = 0; i < P; i++)); do awk -v p="$P" -v i="$i" '(NR - 1) % p == i' plan/sites.txt > "plan/sites-$i.txt"; done
          echo "parts=$(python3 -c "import json; print(json.dumps(list(range($P))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan/
          retention-days: 30

  work:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    env:
      PART: ${{ matrix.part }}
      CRAWLS: ${{ inputs.crawls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan/
      - name: Show this runner's public IP
        # Lets us tell whether parallel jobs share an egress IP (and so a rate limit).
        run: |
          echo "public IP: $(curl -s -m 10 https://checkip.amazonaws.com || echo unknown)"
      - name: Build
        run: go build -o sitecdx ./cmd/sitecdx
      - name: Look up captures in each crawl (CDX index)
        run: |
          mkdir -p cap out
          IFS=, read -ra crawls <<< "$CRAWLS"
          for c in "${crawls[@]}"; do
            c=$(echo "$c" | xargs)
            ./sitecdx -crawl "$c" -sites "plan/sites-$PART.txt" \
              -max-blocks-per-site "${{ inputs.max_blocks }}" -out "cap/captures-$c.tsv.gz"
          done
      - name: Score sites
        run: |
          seeds=(); [ -f plan/seeds.tsv.gz ] && seeds=(--seeds plan/seeds.tsv.gz)
          python3 -I scripts/site_report.py score --mode "${{ inputs.mode }}" --captures 'cap/captures-*.tsv.gz' "${seeds[@]}" \
            --sites-out "out/sites-part-$PART.tsv.gz" --candidates-out "out/candidates-part-$PART.tsv.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: out/
          retention-days: 30

  report:
    needs: work
    if: ${{ !cancelled() }}   # report on whichever partitions succeeded
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: out/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan/
      - name: Merge and report
        run: |
          ls out/
          { zcat out/sites-part-*.tsv.gz | awk 'NR == 1 || $1 != "site"'; } | gzip > out/sites.tsv.gz
          python3 -I scripts/site_report.py report --sites 'out/sites-part-*.tsv.gz' \
            --candidates 'out/candidates-part-*.tsv.gz' --site-list plan/sites.txt \
            --title "${{ inputs.site_source }}, crawls ${{ inputs.crawls }}, max ${{ inputs.max_blocks }} block(s)/site" \
            --report-out out/report.md
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: site-urls-report
          path: |
            out/sites.tsv.gz
            out/report.md
          retention-days: 30
      - name: Publish release assets
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="site-urls-run-${{ github.run_number }}"
          # No --target: tagging the run's own commit fails with 403 once main has newer
          # workflow files (needs the workflows permission). See DESIGN.md.
          gh release create "$tag" --title "Site URLs (run ${{ github.run_number }})" \
            --notes "Sites from ${{ inputs.site_source }} (top ${{ inputs.top }}), crawls ${{ inputs.crawls }}, max ${{ inputs.max_blocks }} block(s)/site, ${{ inputs.partitions }} partitions, ${{ inputs.mode }} mode. See report.md. Built from commit $GITHUB_SHA."
          files=(out/report.md out/sites.tsv.gz out/candidates-part-*.tsv.gz)
          [ -f plan/seeds.tsv.gz ] && files+=(plan/seeds.tsv.gz)
          gh release upload "$tag" "${files[@]}"
